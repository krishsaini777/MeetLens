<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetLens — Real-Time Transcriber</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --bg2: #1a1d2e;
      --bg3: #242840;
      --glass: rgba(255,255,255,0.04);
      --border: rgba(99,102,241,0.18);
      --blue: #6366f1;
      --blue2: #818cf8;
      --pink: #ec4899;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
      --text: #e8eaf6;
      --muted: #7c83a3;
      --font: 'Inter', system-ui, sans-serif;
      --r: 10px;
      --r-sm: 6px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    html, body {
      width: 560px; min-height: 520px; max-height: 640px;
      font-family: var(--font); background: var(--bg);
      color: var(--text); font-size: 13px; overflow: hidden;
    }

    /* ── Layout ── */
    .app { display: flex; flex-direction: column; height: 640px; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 10px;
      background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      font-size: 17px; font-weight: 700; letter-spacing: -0.4px;
      background: linear-gradient(135deg, var(--blue2), var(--pink));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }

    /* Language selector */
    .lang-select {
      padding: 4px 8px; border-radius: var(--r-sm);
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font); font-size: 11px;
      cursor: pointer; outline: none;
    }

    /* Status pill */
    .status-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;
      background: rgba(99,102,241,0.08); border: 1px solid var(--border);
      color: var(--muted); transition: all 200ms;
    }
    .status-pill.recording { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .status-pill.paused    { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: var(--orange); }
    .status-pill.offline   { background: rgba(239,68,68,0.1);  border-color: rgba(239,68,68,0.3);  color: var(--red); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status-pill.recording .dot { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Timer */
    #sessionTimer { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ── Controls ── */
    .controls {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; flex-shrink: 0;
    }
    .btn {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 14px; border: none; border-radius: var(--r-sm);
      font-family: var(--font); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 150ms; letter-spacing: 0.1px;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    .btn-start { background: linear-gradient(135deg,var(--blue),var(--blue2)); color:#fff; flex:1; }
    .btn-start:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(99,102,241,0.45); }

    .btn-stop { background: linear-gradient(135deg,var(--red),#f87171); color:#fff; flex:1; }
    .btn-stop:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(239,68,68,0.45); }

    .btn-pause {
      background: var(--bg3); color: var(--text);
      border: 1px solid var(--border); flex:0 0 auto;
    }
    .btn-pause:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }

    .btn-bookmark {
      background: var(--bg3); color: var(--text);
      border: 1px solid var(--border); flex:0 0 auto;
    }
    .btn-bookmark:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }
    .btn-bookmark.flash { animation: bmFlash 400ms ease; }
    @keyframes bmFlash {
      0%  { background: rgba(245,158,11,0.3); }
      100%{ background: var(--bg3); }
    }

    /* ── Banner ── */
    .banner {
      display: none; align-items: center; gap: 10px;
      margin: 0 16px 8px; padding: 9px 12px; border-radius: var(--r);
      font-size: 12px; animation: slideDown 200ms ease;
    }
    .banner.show { display: flex; }
    .banner.info    { background: rgba(99,102,241,0.1);  border: 1px solid rgba(99,102,241,0.25); color: var(--blue2); }
    .banner.warn    { background: rgba(245,158,11,0.1);  border: 1px solid rgba(245,158,11,0.3);  color: var(--orange); }
    .banner.success { background: rgba(34,197,94,0.1);   border: 1px solid rgba(34,197,94,0.25);  color: var(--green); }
    .banner.error   { background: rgba(239,68,68,0.1);   border: 1px solid rgba(239,68,68,0.3);   color: var(--red); }
    .banner-icon { font-size: 16px; flex-shrink:0; }
    .banner-text { flex:1; }
    .banner-close { cursor:pointer; color:var(--muted); font-size:14px; line-height:1; }
    @keyframes slideDown { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }

    /* ── Tabs ── */
    .tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
    .tab {
      padding: 7px 16px; font-size: 12px; font-weight: 500;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: all 150ms; user-select: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--blue2); border-bottom-color: var(--blue2); }

    /* ── Panel body ── */
    .panel-body { flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; padding: 12px 16px; }
    .panel-body::-webkit-scrollbar { width:4px; }
    .panel-body::-webkit-scrollbar-track { background:transparent; }
    .panel-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

    /* ── Transcript ── */
    .transcript-pane { display:flex; flex-direction:column; }
    .summary-pane    { display:none; flex-direction:column; }
    .transcript-pane.hidden { display:none; }
    .summary-pane.visible   { display:flex; }

    /* Empty state */
    .empty-state {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      height:100%; gap:10px; color:var(--muted);
    }
    .empty-icon { font-size:32px; opacity:0.4; }
    .empty-text { font-size:12px; text-align:center; line-height:1.6; }

    /* Transcript line */
    .t-line {
      display:flex; align-items:flex-start; gap:8px;
      padding: 5px 8px; border-radius: var(--r-sm); margin-bottom:3px;
      animation: fadeUp 200ms ease; transition: background 150ms;
    }
    .t-line:hover { background: var(--glass); }
    .t-line.bookmarked { background: rgba(245,158,11,0.08); border-left:2px solid var(--orange); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

    .t-ts { font-size:10px; color:var(--muted); flex-shrink:0; margin-top:2px; font-variant-numeric:tabular-nums; }
    .t-text {
      flex:1; font-size:12px; line-height:1.6; color:var(--text);
      outline:none;
    }
    .t-text[contenteditable="true"] {
      border-bottom:1px dashed var(--border); cursor:text; padding-bottom:1px;
    }
    .t-text[contenteditable="true"]:focus { border-bottom-color:var(--blue); }
    .t-bm { font-size:12px; color:var(--orange); flex-shrink:0; opacity:0; transition:opacity 150ms; }
    .t-line.bookmarked .t-bm { opacity:1; }
    .t-line:hover .t-bm { opacity:0.5; }

    /* LLM-refined indicator — shows raw text on hover */
    .t-text.has-raw { position:relative; }
    .t-text.has-raw::after {
      content:'✦'; font-size:8px; color:var(--green); margin-left:4px;
      vertical-align:super; opacity:0.6;
    }
    .t-text.has-raw:hover::after { opacity:1; }

    /* Skeleton loader */
    .skeleton-line {
      height:14px; border-radius:7px; margin-bottom:8px;
      background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    .skeleton-line:nth-child(2) { width:80%; }
    .skeleton-line:nth-child(3) { width:60%; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Summary panel ── */
    .summary-section { margin-bottom:16px; }
    .summary-section h3 {
      font-size:11px; font-weight:600; text-transform:uppercase;
      letter-spacing:0.8px; color:var(--blue2); margin-bottom:8px;
    }
    .summary-text { font-size:12px; line-height:1.7; color:var(--text); }
    .summary-list { list-style:none; }
    .summary-list li {
      font-size:12px; line-height:1.6; color:var(--text);
      padding: 4px 0 4px 16px; position:relative;
    }
    .summary-list li::before { content:'•'; position:absolute; left:4px; color:var(--blue2); }
    .action-list li::before  { content:'☐'; color:var(--green); }
    .summary-empty { color:var(--muted); font-size:12px; font-style:italic; }

    /* Summarize button */
    .btn-summarize {
      width:100%; padding:10px; border:none; border-radius:var(--r);
      background: linear-gradient(135deg,var(--blue),var(--pink));
      color:#fff; font-family:var(--font); font-size:13px; font-weight:600;
      cursor:pointer; transition:all 200ms; margin-bottom:12px;
    }
    .btn-summarize:hover:not(:disabled) { box-shadow:0 4px 20px rgba(99,102,241,0.5); }
    .btn-summarize:disabled { opacity:0.5; cursor:not-allowed; }

    /* ── Footer ── */
    .footer {
      display:flex; align-items:center; justify-content:space-between;
      padding: 8px 16px; border-top:1px solid var(--border);
      flex-shrink:0; gap:8px;
    }
    .footer-left  { display:flex; align-items:center; gap:8px; }
    .footer-right { display:flex; align-items:center; gap:6px; }

    .status-text { font-size:10px; color:var(--muted); }
    .autosave-dot { width:6px; height:6px; border-radius:50%; background:var(--green); opacity:0; transition:opacity 300ms; }
    .autosave-dot.flash { opacity:1; }

    .btn-sm {
      padding:5px 10px; border:1px solid var(--border);
      border-radius:var(--r-sm); background:var(--bg3); color:var(--text);
      font-family:var(--font); font-size:10px; font-weight:500;
      cursor:pointer; transition:all 150ms;
    }
    .btn-sm:hover { border-color:var(--blue); color:var(--blue2); }
    .btn-export { background:linear-gradient(135deg,var(--blue),var(--pink)); color:#fff; border:none; font-weight:600; }
    .btn-export:hover { box-shadow:0 2px 12px rgba(99,102,241,0.4); }

    /* Spinner */
    .spinner {
      display:inline-block; width:12px; height:12px;
      border:2px solid rgba(255,255,255,0.3);
      border-top-color:#fff; border-radius:50%;
      animation:spin 0.7s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>
<div class="app" id="app">

  <!-- Header -->
  <div class="header">
    <span class="logo">MeetLens</span>
    <div class="header-right">
      <span id="sessionTimer">00:00</span>
      <select id="langSelect" class="lang-select">
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Spanish</option>
        <option value="fr">🇫🇷 French</option>
        <option value="de">🇩🇪 German</option>
        <option value="it">🇮🇹 Italian</option>
        <option value="pt">🇧🇷 Portuguese</option>
        <option value="hi">🇮🇳 Hindi</option>
        <option value="ja">🇯🇵 Japanese</option>
        <option value="ko">🇰🇷 Korean</option>
        <option value="zh">🇨🇳 Chinese</option>
        <option value="ar">🇸🇦 Arabic</option>
        <option value="ru">🇷🇺 Russian</option>
      </select>
      <div class="status-pill" id="statusPill">
        <div class="dot"></div>
        <span id="statusLabel">Idle</span>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="btnStart" class="btn btn-start">▶ Start</button>
    <button id="btnStop"  class="btn btn-stop"  disabled>■ Stop</button>
    <button id="btnPause" class="btn btn-pause" disabled title="Pause/Resume">⏸</button>
    <button id="btnBookmark" class="btn btn-bookmark" disabled title="Bookmark (Ctrl+Space)">⭐</button>
  </div>

  <!-- Banner -->
  <div class="banner" id="banner">
    <span class="banner-icon" id="bannerIcon">ℹ️</span>
    <span class="banner-text" id="bannerText"></span>
    <span class="banner-close" id="bannerClose">✕</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tabTranscript" data-tab="transcript">Transcript</div>
    <div class="tab" id="tabSummary" data-tab="summary">Summary</div>
  </div>

  <!-- Panel body -->
  <div class="panel-body" id="panelBody">

    <!-- Transcript pane -->
    <div class="transcript-pane" id="transcriptPane">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎙️</div>
        <div class="empty-text">Press <strong>Start</strong> to begin transcribing.<br>Transcription appears here in real time.</div>
      </div>
    </div>

    <!-- Summary pane -->
    <div class="summary-pane" id="summaryPane">
      <button class="btn-summarize" id="btnSummarize">✨ Generate Summary</button>
      <div id="summaryContent">
        <div class="empty-state">
          <div class="empty-icon">✨</div>
          <div class="empty-text">Stop recording and click <strong>Generate Summary</strong><br>to get a Gemini-powered analysis.</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-left">
      <div class="autosave-dot" id="autosaveDot"></div>
      <span class="status-text" id="footerStatus">Ready</span>
    </div>
    <div class="footer-right">
      <button class="btn-sm" id="btnCopyMd" disabled>📋 Markdown</button>
      <button class="btn-sm" id="btnNewSession">New Session</button>
      <button class="btn-sm btn-export" id="btnExport" disabled>⬇ Export PDF</button>
    </div>
  </div>

</div>

<script type="module" src="popup.js"></script>
</body>
</html>
